<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>وضع الكتاب المدرسي - القراءة والكتابة</title>
<meta name="theme-color" content="#2f6f69">
<link rel="icon" href="icons/icon-192.png">
<style>
@font-face{font-family:NoorNaskh;src:url("fonts/NotoNaskhArabic.ttf") format("truetype");font-weight:400;font-display:swap}
@font-face{font-family:NoorAmiri;src:url("fonts/Amiri-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
:root{--bg:#f5f7f2;--paper:#fff;--ink:#17202a;--muted:#667085;--line:#d9e1dc;--green:#2f6f69;--green2:#245954;--soft:#edf5f2;--blue:#356d91;--ok:#24724c;--bad:#93443d;--focus:#dfeee9;--shadow:0 10px 28px rgba(23,32,42,.07)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:NoorNaskh,NoorAmiri,Tahoma,sans-serif}
button,a{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.55}a{text-decoration:none;color:inherit}body{overflow-x:hidden}
.shell{max-width:1120px;margin:auto;padding:12px 14px 40px}
.appbar{display:flex;align-items:center;gap:12px;min-height:64px;background:rgba(245,247,242,.97);position:sticky;top:0;z-index:50;border-bottom:1px solid rgba(217,225,220,.9);padding:8px 0}
.brand{flex:1;min-width:0}.brand b{display:block;font-size:1.2rem;color:var(--green2)}.brand small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn,.soft-btn,.primary-btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;font-weight:800}
.icon-btn{width:48px;padding:0;font-size:1.15rem}.primary-btn{background:var(--green);border-color:var(--green);color:#fff}.soft-btn{background:var(--soft);border-color:#cfe2dc;color:var(--green2)}
.hero{margin:14px 0 10px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.hero-letter{width:74px;height:74px;border-radius:18px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--green2);font-size:3.8rem;line-height:1;border:1px solid #cfe2dc}
.hero-copy h1{font-size:1.32rem;margin:0}.hero-copy p{margin:2px 0 0;color:var(--muted);font-size:.9rem}.focus-badge{font-size:.78rem;padding:7px 10px;border-radius:999px;background:#f0f4f3;color:#47625e;font-weight:800;white-space:nowrap}
.stepbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:10px 0 14px}
.step{background:#fff;border:1px solid var(--line);border-radius:15px;min-height:58px;padding:7px 5px;text-align:center;color:#667085;font-weight:800;font-size:.83rem}
.step span{display:block;font-size:1.1rem;line-height:1.1;margin-bottom:2px}.step.active{background:var(--focus);border-color:#9bc8bb;color:var(--green2)}.step.done{border-color:#b8d9c8;color:var(--ok)}
.progressline{height:7px;background:#e4eae7;border-radius:999px;overflow:hidden;margin:0 2px 14px}.progressline i{display:block;height:100%;background:var(--green);width:25%;transition:width .15s ease}
.stage{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px;min-height:440px}
.stage-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px}.stage-no{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.05rem;font-weight:900}
.stage-title h2{margin:0;font-size:1.25rem}.stage-title p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
.task-card{border:1px solid var(--line);border-radius:18px;background:#fbfcfa;padding:14px;margin-bottom:12px}.task-card h3{font-size:1rem;margin:0 0 8px;color:#344054}.task-note{color:var(--muted);font-size:.84rem;margin:0 0 10px}
.sound-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.sound-btn{border:1px solid #cfdad5;background:#fff;border-radius:16px;min-height:78px;padding:8px;color:#18322f;font-size:1.8rem;font-weight:800;position:relative}
.sound-btn small{display:block;font-size:.72rem;color:var(--muted);font-weight:700;margin-top:4px}.sound-btn.playing{background:#e7f3ef;border-color:#7fb7a8}
.listen-main{display:flex;align-items:center;justify-content:center;gap:14px;min-height:130px;background:#f5faf8;border:1px solid #d5e7e1;border-radius:18px;margin-bottom:12px}.listen-main .glyph{font-size:5rem;color:#173f3a}
.play-big{min-width:150px;min-height:58px;border:0;border-radius:16px;background:var(--green);color:white;font-weight:900;font-size:1rem}.source-note{text-align:center;color:#6b7773;font-size:.75rem;margin-top:8px}
.word-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.word-card{border:1px solid var(--line);border-radius:16px;background:#fff;padding:12px;text-align:center;min-height:86px}.word-card b{display:block;font-size:1.55rem;margin-bottom:3px}.word-card small{color:var(--muted)}.target-letter{color:#b13f3f;font-weight:900}
.reading-box{border:1px solid #d5e1dc;border-radius:18px;padding:14px;background:#fdfefd}.reading-box h3{margin:0 0 10px;color:#365b56}.reading-sentence{font-size:1.22rem;line-height:2.1;margin:0;min-height:78px}
.sentence-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}.sentence-nav b{font-size:.82rem;color:var(--muted)}
.movement{margin-top:12px;border:1px solid #efd6a8;background:#fff9ef;border-radius:17px;padding:12px;display:flex;gap:10px;align-items:center}.movement .move-icon{font-size:1.35rem}.movement p{margin:0;flex:1;font-size:.9rem;color:#684c22}
.shape-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.shape{text-align:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:9px;font-size:1.8rem;min-height:70px}.shape small{display:block;font-size:.68rem;color:var(--muted)}
.write-wrap{position:relative;border:1px solid #cfdad5;border-radius:18px;overflow:hidden;background:#fff}.write-lines{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,transparent 32%,rgba(53,109,145,.15) 32%,rgba(53,109,145,.15) 33%,transparent 33%,transparent 66%,rgba(53,109,145,.15) 66%,rgba(53,109,145,.15) 67%,transparent 67%)}
.guide-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;color:rgba(47,111,105,.11);font-size:12rem}#writeCanvas{display:block;width:100%;height:270px;touch-action:none;position:relative;z-index:2}.write-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.quiz-prompt{font-size:1.1rem;font-weight:900;margin-bottom:12px}.option-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.option{min-height:68px;border:1px solid #cfdad5;border-radius:16px;background:white;font-size:1.45rem;font-weight:800}
.option.good{background:#edf8f2;border-color:#91c9a8;color:#205c3d}.option.bad{background:#fbf1f0;border-color:#deb1ad;color:#743b36}.feedback{min-height:32px;margin-top:10px;font-weight:800;color:#42526a}
.stage-actions{display:flex;justify-content:space-between;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.stage-actions button{min-width:120px}
.teacher-drawer{position:fixed;inset:0;z-index:100;background:rgba(17,24,39,.32);display:none;align-items:flex-start;justify-content:flex-start}.teacher-drawer.open{display:flex}.drawer-card{width:min(390px,92vw);height:100%;background:#fff;padding:16px;box-shadow:18px 0 50px rgba(17,24,39,.15);overflow:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.drawer-head h2{font-size:1.12rem;margin:0}.unit-block{border-top:1px solid var(--line);padding:12px 0}.unit-block h3{font-size:.95rem;margin:0 0 8px;color:#475467}
.letter-pills{display:flex;gap:7px;flex-wrap:wrap}.letter-pill{width:50px;height:50px;border:1px solid var(--line);border-radius:13px;background:#fff;font-size:1.25rem;font-weight:800}.letter-pill.active{background:var(--green);color:#fff;border-color:var(--green)}.letter-pill.done{box-shadow:inset 0 0 0 2px #9bcdb0}
.drawer-note{font-size:.82rem;line-height:1.7;color:#667085;background:#f7f9f8;border-radius:14px;padding:10px}.reward{position:fixed;inset:auto 50% 24px auto;transform:translateX(50%);background:#193f3a;color:#fff;border-radius:15px;padding:10px 16px;font-weight:800;z-index:120;opacity:0;pointer-events:none;transition:opacity .12s ease}.reward.show{opacity:1}
.empty{border:1px dashed #c9d3ce;border-radius:17px;padding:18px;color:#667085;background:#fafbf9;text-align:center;line-height:1.8}
@media(max-width:720px){.shell{padding:8px 9px 30px}.appbar{min-height:58px}.brand b{font-size:1.05rem}.hero{grid-template-columns:auto 1fr;padding:11px}.hero-letter{width:62px;height:62px;font-size:3.2rem}.focus-badge{grid-column:1/-1;justify-self:start}.step{font-size:.74rem;min-height:54px}.stage{padding:13px;border-radius:20px;min-height:420px}.sound-grid{gap:6px}.sound-btn{min-height:72px;font-size:1.6rem}.word-grid{grid-template-columns:1fr 1fr}}
@media(max-width:430px){.brand small{display:none}.hero-copy h1{font-size:1.15rem}.stepbar{gap:4px}.step{padding:6px 2px}.step span{font-size:1rem}.sound-grid{grid-template-columns:repeat(3,1fr)}.option-grid{grid-template-columns:repeat(3,1fr)}.stage-actions button{min-width:0;flex:1}.word-card b{font-size:1.35rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
:focus-visible{outline:3px solid rgba(53,109,145,.30);outline-offset:2px}
</style>
</head>
<body>
<div class="shell">
<header class="appbar">
<button class="icon-btn" id="menuBtn" type="button" aria-label="اختيار الوحدة والحرف">☰</button>
<div class="brand"><b>الكتاب المدرسي · قراءة وكتابة</b><small>نشاط قصير وواضح، خطوة واحدة في كل مرة</small></div>
<a class="soft-btn" href="index.html">النورانية</a>
</header>
<section class="hero">
<div class="hero-letter" id="heroLetter">م</div>
<div class="hero-copy"><h1 id="heroTitle">حرف م</h1><p id="heroMeta">الوحدة الأولى · أسرتي · ص 106</p></div>
<span class="focus-badge">وضع التركيز</span>
</section>
<nav class="stepbar" aria-label="خطوات التعلم">
<button class="step active" data-stage="0" type="button"><span>🔊</span>أسمع</button>
<button class="step" data-stage="1" type="button"><span>📖</span>أقرأ</button>
<button class="step" data-stage="2" type="button"><span>✍️</span>أكتب</button>
<button class="step" data-stage="3" type="button"><span>✓</span>أتحقق</button>
</nav>
<div class="progressline"><i id="stageProgress"></i></div>
<main class="stage" id="stage"></main>
</div>
<div class="teacher-drawer" id="drawer" aria-hidden="true">
<div class="drawer-card">
<div class="drawer-head"><h2>اختيار الوحدة والحرف</h2><button class="icon-btn" id="closeDrawerBtn" type="button" aria-label="إغلاق">×</button></div>
<div class="drawer-note">هذه القائمة للمعلم أو ولي الأمر. واجهة الطالب تبقى مركّزة على نشاط واحد لتقليل المشتتات.</div>
<div id="curriculumList"></div>
<div class="unit-block"><button class="soft-btn" id="resetBtn" type="button">تصفير تقدم هذا المسار</button></div>
</div>
</div>
<div class="reward" id="reward" role="status" aria-live="polite">أحسنت، أكملت الخطوة.</div>
<script>
(function(){
"use strict";
var STAGES=[
{name:"أسمع",hint:"اسمع اسم الحرف أولًا، ثم تدرب على أصواته القصيرة والطويلة."},
{name:"أقرأ",hint:"اقرأ كلمات الكتاب، ثم جملة قصيرة فقط في كل مرة."},
{name:"أكتب",hint:"شاهد الشكل ثم جرّب الكتابة بيدك."},
{name:"أتحقق",hint:"ثلاثة أسئلة قصيرة مع تغذية راجعة مباشرة."}
];
var fallbackCurriculum={units:[
{id:1,title:"أُسْرَتِي",letters:[{letter:"م",page:106},{letter:"ب",page:114},{letter:"ل",page:122},{letter:"د",page:130},{letter:"ن",page:138},{letter:"ر",page:146}]},
{id:2,title:"مَدْرَسَتِي",letters:[{letter:"ص",page:164},{letter:"ف",page:172},{letter:"س",page:180},{letter:"ق",page:187},{letter:"ت",page:194},{letter:"ح",page:202}]},
{id:3,title:"مَدِينَتِي",letters:[{letter:"أ",page:220},{letter:"ط",page:227},{letter:"ز",page:234},{letter:"و",page:242},{letter:"ج",page:250},{letter:"ش",page:257}]}
]};
var curriculum=fallbackCurriculum,audioMap={letters:{}},bookContent={letters:{}};
var currentUnit=0,currentLetter=0,currentStage=0,sentenceIndex=0,quizIndex=0;
var activeAudio=null,rewardTimer=null,progress={};
try{progress=JSON.parse(localStorage.getItem("schoolbook_focus_progress_v2")||"{}")||{};}catch(e){progress={};}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function save(){try{localStorage.setItem("schoolbook_focus_progress_v2",JSON.stringify(progress));}catch(e){}}
function current(){var u=curriculum.units[currentUnit],l=u.letters[currentLetter];return{unit:u,letter:l,ch:l.letter};}
function pkey(){var c=current();return"u"+c.unit.id+"_"+c.ch;}
function state(){var k=pkey();progress[k]=progress[k]||{doneStages:{}};progress[k].doneStages=progress[k].doneStages||{};return progress[k];}
function setDone(stage){state().doneStages[String(stage)]=true;save();renderSteps();renderDrawer();}
function showReward(text){var el=document.getElementById("reward");el.textContent=text||"أحسنت، أكملت الخطوة.";el.classList.add("show");clearTimeout(rewardTimer);rewardTimer=setTimeout(function(){el.classList.remove("show");},1500);}
function highlightLetter(text,ch){var safe=esc(text),needle=esc(ch);return safe.split(needle).join('<span class="target-letter">'+needle+"</span>");}
function shapesFor(ch){var map={"م":["م","مـ","ـمـ","ـم"],"ب":["ب","بـ","ـبـ","ـب"],"ل":["ل","لـ","ـلـ","ـل"],"د":["د","د","ـد","ـد"],"ن":["ن","نـ","ـنـ","ـن"],"ر":["ر","ر","ـر","ـر"],"ص":["ص","صـ","ـصـ","ـص"],"ف":["ف","فـ","ـفـ","ـف"],"س":["س","سـ","ـسـ","ـس"],"ق":["ق","قـ","ـقـ","ـق"],"ت":["ت","تـ","ـتـ","ـت"],"ح":["ح","حـ","ـحـ","ـح"],"أ":["أ","أ","ـأ","ـأ"],"ط":["ط","طـ","ـطـ","ـط"],"ز":["ز","ز","ـز","ـز"],"و":["و","و","ـو","ـو"],"ج":["ج","جـ","ـجـ","ـج"],"ش":["ش","شـ","ـشـ","ـش"]};return map[ch]||[ch,ch,ch,ch];}
function genericSounds(ch){if(ch==="أ")return{short:["أَ","إِ","أُ"],long:["آ","إِي","أُو"]};return{short:[ch+"َ",ch+"ِ",ch+"ُ"],long:[ch+"َا",ch+"ِي",ch+"ُو"]};}
function playFile(file,button){if(!file)return;if(activeAudio){try{activeAudio.pause();activeAudio.currentTime=0;}catch(e){}}Array.prototype.forEach.call(document.querySelectorAll(".sound-btn.playing"),function(b){b.classList.remove("playing");});var a=new Audio("assets/audio/"+file);activeAudio=a;if(button)button.classList.add("playing");a.preload="auto";a.setAttribute("playsinline","");a.onended=function(){if(button)button.classList.remove("playing");};a.onerror=function(){if(button)button.classList.remove("playing");};var p=a.play();if(p&&p.catch)p.catch(function(){if(button)button.classList.remove("playing");});}
function audioButton(label,obj,sub){var file=obj&&obj.file?obj.file:"";return'<button class="sound-btn" type="button" data-audio="'+esc(file)+'" '+(file?"":"disabled")+">"+esc(label)+"<small>"+(file?esc(sub||"اسمع"):"الصوت غير متاح")+"</small></button>";}
function bindAudio(){Array.prototype.forEach.call(document.querySelectorAll("[data-audio]"),function(b){b.onclick=function(){playFile(b.getAttribute("data-audio"),b);};});}
function renderHeader(){var c=current();document.getElementById("heroLetter").textContent=c.ch;document.getElementById("heroTitle").textContent="حرف "+c.ch;document.getElementById("heroMeta").textContent="الوحدة "+c.unit.id+" · "+c.unit.title+" · صفحة "+c.letter.page;}
function renderSteps(){var st=state();Array.prototype.forEach.call(document.querySelectorAll(".step"),function(b,i){b.classList.toggle("active",i===currentStage);b.classList.toggle("done",!!st.doneStages[String(i)]);});document.getElementById("stageProgress").style.width=((currentStage+1)/STAGES.length*100)+"%";}
function stageHead(n){return'<div class="stage-head"><div class="stage-no">'+(n+1)+'</div><div class="stage-title"><h2>'+STAGES[n].name+"</h2><p>"+STAGES[n].hint+"</p></div></div>";}
function navButtons(){return'<div class="stage-actions"><button class="soft-btn" id="prevStageBtn" type="button" '+(currentStage===0?"disabled":"")+'>السابق</button><button class="primary-btn" id="nextStageBtn" type="button">'+(currentStage===STAGES.length-1?"إنهاء الحرف":"التالي")+"</button></div>";}
function bindStageNav(){var prev=document.getElementById("prevStageBtn"),next=document.getElementById("nextStageBtn");if(prev)prev.onclick=function(){if(currentStage>0){currentStage--;renderStage();}};if(next)next.onclick=function(){setDone(currentStage);if(currentStage<STAGES.length-1){currentStage++;showReward("أحسنت. ننتقل للخطوة التالية.");renderStage();}else{state().mastered=true;save();showReward("أحسنت. أكملت حرف "+current().ch+".");renderDrawer();}};}
function renderListen(){var c=current(),m=audioMap.letters[c.ch]||{},sounds=genericSounds(c.ch),shortObjs=m.short||[],longObjs=m.long||[],h=stageHead(0);h+='<div class="listen-main"><div class="glyph">'+esc(c.ch)+'</div><button class="play-big" id="mainAudioBtn" type="button">▶ اسم الحرف</button></div>';h+='<div class="task-card"><h3>الأصوات القصيرة</h3><p class="task-note">اسمع صوتًا واحدًا، ثم ردده مرة واحدة.</p><div class="sound-grid">';sounds.short.forEach(function(x,i){h+=audioButton(x,shortObjs[i],"قصير");});h+='</div></div><div class="task-card"><h3>الأصوات الطويلة</h3><p class="task-note">مدّ الصوت بهدوء.</p><div class="sound-grid">';sounds.long.forEach(function(x,i){h+=audioButton(x,longObjs[i],"طويل");});h+='</div></div><div class="source-note">الأصوات من ملفات القاعدة النورانية الموجودة داخل المشروع.</div>'+navButtons();document.getElementById("stage").innerHTML=h;bindAudio();var main=document.getElementById("mainAudioBtn");main.onclick=function(){playFile(m.isolated&&m.isolated.file?m.isolated.file:"",main);};bindStageNav();}
function renderRead(){var c=current(),content=bookContent.letters[c.ch]||null,h=stageHead(1);if(content&&content.words&&content.words.length){h+='<div class="task-card"><h3>كلمات من درس الكتاب</h3><p class="task-note">اقرأ كلمة واحدة في كل مرة وابحث عن حرف '+esc(c.ch)+'.</p><div class="word-grid">';content.words.forEach(function(w){h+='<div class="word-card"><b>'+highlightLetter(w.text,c.ch)+'</b><small>'+esc(w.position||"")+"</small></div>";});h+="</div></div>";}else{h+='<div class="empty">أصوات الحرف جاهزة، لكن كلمات هذا الدرس ستضاف بعد توفير صفحات الحرف من الكتاب حتى لا نضع كلمات غير منهجية.</div>';}if(content&&content.reading&&content.reading.sentences&&content.reading.sentences.length){var arr=content.reading.sentences;if(sentenceIndex>=arr.length)sentenceIndex=0;h+='<div class="reading-box"><h3>'+esc(content.reading.title)+'</h3><p class="reading-sentence">'+highlightLetter(arr[sentenceIndex],c.ch)+'</p><div class="sentence-nav"><button class="soft-btn" id="prevSentenceBtn" type="button" '+(sentenceIndex===0?"disabled":"")+'>السابق</button><b>جملة '+(sentenceIndex+1)+" من "+arr.length+'</b><button class="soft-btn" id="nextSentenceBtn" type="button" '+(sentenceIndex===arr.length-1?"disabled":"")+">التالي</button></div></div>";h+='<div class="movement"><span class="move-icon">↟</span><p>'+esc(content.movementPrompt||"خذ استراحة حركة قصيرة.")+'</p><button class="soft-btn" id="moveDoneBtn" type="button">تم</button></div>';}h+=navButtons();document.getElementById("stage").innerHTML=h;var ps=document.getElementById("prevSentenceBtn"),ns=document.getElementById("nextSentenceBtn");if(ps)ps.onclick=function(){if(sentenceIndex>0){sentenceIndex--;renderRead();}};if(ns)ns.onclick=function(){var a=bookContent.letters[c.ch].reading.sentences||[];if(sentenceIndex<a.length-1){sentenceIndex++;renderRead();}};var md=document.getElementById("moveDoneBtn");if(md)md.onclick=function(){md.textContent="✓";md.disabled=true;};bindStageNav();}
function renderWrite(){var c=current(),content=bookContent.letters[c.ch]||{},shapes=(content.focus&&content.focus.shapes)||shapesFor(c.ch),labels=["مفرد","أول","وسط","آخر"],h=stageHead(2);h+='<div class="task-card"><h3>أشكال الحرف</h3><p class="task-note">شاهد الشكل ثم انتقل للكتابة.</p><div class="shape-row">';shapes.forEach(function(x,i){h+='<div class="shape">'+esc(x)+"<small>"+labels[i]+"</small></div>";});h+='</div></div><div class="task-card"><h3>أتتبع وأكتب</h3><p class="task-note">ابدأ فوق النموذج، ثم أخفِه عندما تصبح جاهزًا.</p><div class="write-wrap"><div class="write-lines"></div><div class="guide-letter" id="guideLetter">'+esc(c.ch)+'</div><canvas id="writeCanvas"></canvas></div><div class="write-tools"><button class="soft-btn" id="guideBtn" type="button">إخفاء النموذج</button><button class="soft-btn" id="clearBtn" type="button">مسح</button></div></div>';h+=navButtons();document.getElementById("stage").innerHTML=h;setupCanvas();bindStageNav();}
function quizSet(){var c=current(),u=c.unit,sounds=genericSounds(c.ch),content=bookContent.letters[c.ch]||{},distractors=u.letters.map(function(x){return x.letter;}).filter(function(x){return x!==c.ch;}),opts1=[c.ch].concat(distractors.slice(0,2)),q=[{prompt:"أين حرف "+c.ch+"؟",answer:c.ch,options:opts1},{prompt:"اختر الصوت القصير بالفتحة.",answer:sounds.short[0],options:sounds.short.slice()},{prompt:"اختر الصوت الطويل بالألف.",answer:sounds.long[0],options:sounds.long.slice()}];if(content.words&&content.words.length>=3)q[2]={prompt:"أي كلمة تبدأ بحرف "+c.ch+"؟",answer:content.words[0].text,options:[content.words[0].text,content.words[1].text,content.words[2].text]};return q;}
function renderQuiz(){var qs=quizSet();if(quizIndex>=qs.length)quizIndex=0;var q=qs[quizIndex],h=stageHead(3);h+='<div class="task-card"><div class="quiz-prompt">'+esc(q.prompt)+'</div><div class="option-grid">';q.options.forEach(function(x){h+='<button class="option" type="button" data-answer="'+esc(x)+'">'+esc(x)+"</button>";});h+='</div><div class="feedback" id="feedback">اختر إجابة واحدة.</div></div><div class="stage-actions"><button class="soft-btn" id="prevStageBtn" type="button">العودة للكتابة</button><button class="primary-btn" id="nextQuestionBtn" type="button">'+(quizIndex===qs.length-1?"إنهاء الحرف":"السؤال التالي")+"</button></div>";document.getElementById("stage").innerHTML=h;Array.prototype.forEach.call(document.querySelectorAll(".option"),function(b){b.onclick=function(){var chosen=b.getAttribute("data-answer");Array.prototype.forEach.call(document.querySelectorAll(".option"),function(x){x.disabled=true;if(x.getAttribute("data-answer")===q.answer)x.classList.add("good");});if(chosen===q.answer){document.getElementById("feedback").textContent="صحيح. عمل جيد.";state().correct=(state().correct||0)+1;}else{b.classList.add("bad");document.getElementById("feedback").textContent="ليست هذه. انظر إلى الإجابة الصحيحة ثم جرّب في السؤال التالي.";}save();};});document.getElementById("prevStageBtn").onclick=function(){currentStage=2;renderStage();};document.getElementById("nextQuestionBtn").onclick=function(){if(quizIndex<qs.length-1){quizIndex++;renderQuiz();}else{setDone(3);state().mastered=true;save();showReward("أحسنت. أكملت حرف "+current().ch+".");renderDrawer();}};}
function renderStage(){renderHeader();renderSteps();if(activeAudio){try{activeAudio.pause();}catch(e){}activeAudio=null;}if(currentStage===0)renderListen();else if(currentStage===1)renderRead();else if(currentStage===2)renderWrite();else renderQuiz();window.scrollTo(0,0);}
function setupCanvas(){var canvas=document.getElementById("writeCanvas");if(!canvas)return;var ctx=canvas.getContext("2d"),drawing=false,lx=0,ly=0;function resize(){var r=canvas.getBoundingClientRect(),ratio=window.devicePixelRatio||1,w=Math.round(r.width*ratio),h=Math.round(r.height*ratio);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;ctx.setTransform(ratio,0,0,ratio,0,0);ctx.lineWidth=5;ctx.lineCap="round";ctx.lineJoin="round";ctx.strokeStyle="#193f3a";}}function point(e){var r=canvas.getBoundingClientRect(),t=e.touches&&e.touches[0]?e.touches[0]:e;return{x:t.clientX-r.left,y:t.clientY-r.top};}function down(e){resize();drawing=true;var p=point(e);lx=p.x;ly=p.y;e.preventDefault();}function move(e){if(!drawing)return;var p=point(e);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;e.preventDefault();}function up(e){drawing=false;if(e)e.preventDefault();}resize();canvas.addEventListener("mousedown",down);canvas.addEventListener("mousemove",move);window.addEventListener("mouseup",up);canvas.addEventListener("touchstart",down,{passive:false});canvas.addEventListener("touchmove",move,{passive:false});canvas.addEventListener("touchend",up,{passive:false});document.getElementById("clearBtn").onclick=function(){resize();ctx.clearRect(0,0,canvas.width,canvas.height);};document.getElementById("guideBtn").onclick=function(){var g=document.getElementById("guideLetter"),show=g.style.display==="none";g.style.display=show?"flex":"none";this.textContent=show?"إخفاء النموذج":"إظهار النموذج";};}
function renderDrawer(){var box=document.getElementById("curriculumList");box.innerHTML="";curriculum.units.forEach(function(u,ui){var div=document.createElement("div");div.className="unit-block";div.innerHTML="<h3>الوحدة "+u.id+" · "+esc(u.title)+"</h3>";var row=document.createElement("div");row.className="letter-pills";u.letters.forEach(function(l,li){var b=document.createElement("button"),k="u"+u.id+"_"+l.letter,st=progress[k]||{};b.type="button";b.className="letter-pill"+(ui===currentUnit&&li===currentLetter?" active":"")+(st.mastered?" done":"");b.textContent=l.letter;b.title="حرف "+l.letter+" · ص "+l.page;b.onclick=function(){currentUnit=ui;currentLetter=li;currentStage=0;sentenceIndex=0;quizIndex=0;closeDrawer();renderStage();};row.appendChild(b);});div.appendChild(row);box.appendChild(div);});}

]).then(function(res){curriculum=res[0]&&res[0].units?res[0]:fallbackCurriculum;audioMap=res[1]||{letters:{}};bookContent=res[2]||{letters:{}};renderDrawer();renderStage();});
